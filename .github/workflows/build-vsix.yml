name: Build VSIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VSIX 的 VSSDK BuildTools 使用 CodeTaskFactory，仅完整版 MSBuild（随 VS 安装）支持，
      # dotnet build 的 .NET Core MSBuild 不支持（MSB4801），故改用运行机预装的 VS MSBuild。
      - name: Restore & Build (VS MSBuild)
        shell: pwsh
        run: |
          $msbuild = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\MSBuild\Current\Bin\MSBuild.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found' }
          Write-Host "Using: $($msbuild.FullName)"
          & $msbuild.FullName 'src\VsArrayPlotter\VsArrayPlotter.csproj' /restore /p:Configuration=Release /p:DeployExtension=false

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: VsArrayPlotter-vsix
          path: src/VsArrayPlotter/bin/Release/VsArrayPlotter.vsix
