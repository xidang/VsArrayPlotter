name: Build VSIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VSIX 的 VSSDK BuildTools 使用 CodeTaskFactory，仅完整版 MSBuild（随 VS 安装）支持，
      # dotnet build 的 .NET Core MSBuild 不支持（MSB4801）。运行机映像为 windows-2025-vs2026，
      # 用 setup-msbuild 自动定位 MSBuild 并加入 PATH。
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore & Build
        shell: pwsh
        run: msbuild 'src\VsArrayPlotter\VsArrayPlotter.csproj' /restore /p:Configuration=Release /p:DeployExtension=false

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: VsArrayPlotter-vsix
          path: src/VsArrayPlotter/bin/Release/VsArrayPlotter.vsix
