name: Build VSIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VSIX 的 VSSDK BuildTools 使用 CodeTaskFactory，仅完整版 MSBuild（随 VS 安装）支持，
      # dotnet build 的 .NET Core MSBuild 不支持（MSB4801）。运行机映像为 windows-2025-vs2026，
      # 用 setup-msbuild 自动定位 MSBuild 并加入 PATH。
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # SDK 风格工程默认不会走 PrepareForRun（旧式工程的 VSSDK 挂接点），因此 CreateVsixContainer
      # 不会随默认 Build 执行；这里显式补齐旧式工程的 PrepareForRunDependsOn 里的 VSSDK 目标链。
      - name: Restore & Build
        shell: pwsh
        run: |
          msbuild 'src\VsArrayPlotter\VsArrayPlotter.csproj' /restore '/t:Build;GeneratePkgDef;CopyPkgDef;CreateVsixContainer' /p:Configuration=Release /p:DeployExtension=false
          if ($LASTEXITCODE -ne 0) { Write-Host '^^ build FAILED'; exit 1 }
          $vsix = Get-ChildItem -Recurse 'src\VsArrayPlotter\bin\Release' -Filter '*.vsix' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vsix) {
            Write-Host '^^ NO VSIX PRODUCED'
            Get-ChildItem -Recurse 'src\VsArrayPlotter\bin\Release' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          New-Item -ItemType Directory -Force 'vsix_out' | Out-Null
          Copy-Item $vsix.FullName "vsix_out\$($vsix.Name)" -Force
          Write-Host "VSIX OK: $($vsix.FullName) ($($vsix.Length) bytes)"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: VsArrayPlotter-vsix
          path: vsix_out/VsArrayPlotter.vsix
