name: Build VSIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VSIX 的 VSSDK BuildTools 使用 CodeTaskFactory，仅完整版 MSBuild（随 VS 安装）支持，
      # dotnet build 的 .NET Core MSBuild 不支持（MSB4801）。运行机映像为 windows-2025-vs2026，
      # 用 setup-msbuild 自动定位 MSBuild 并加入 PATH。
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore & Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          msbuild 'src\VsArrayPlotter\VsArrayPlotter.csproj' /restore /p:Configuration=Release /p:DeployExtension=false
          Write-Host "main build exit=$LASTEXITCODE"
          $pkg = 'C:\Users\runneradmin\.nuget\packages\microsoft.vssdk.buildtools\17.0.5232'
          Write-Host '--- package build files ---'
          Get-ChildItem "$pkg\build" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName.Replace($pkg + '\','') }
          Write-Host '--- props full ---'
          Get-Content "$pkg\build\Microsoft.VSSDK.BuildTools.props" -ErrorAction SilentlyContinue
          Write-Host '--- targets full ---'
          Get-Content "$pkg\build\Microsoft.VSSDK.BuildTools.targets" -ErrorAction SilentlyContinue
          Write-Host '--- tools\VSSDK dirs ---'
          Get-ChildItem "$pkg\tools\VSSDK" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
          Write-Host '--- try explicit CreateVsixContainer ---'
          msbuild 'src\VsArrayPlotter\VsArrayPlotter.csproj' /t:CreateVsixContainer /p:Configuration=Release /p:DeployExtension=false
          Write-Host "CreateVsixContainer exit=$LASTEXITCODE"
          Write-Host '--- bin\Release contents ---'
          Get-ChildItem -Recurse 'src\VsArrayPlotter\bin\Release' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName.Replace((Get-Location).Path + '\','') }

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: VsArrayPlotter-vsix
          path: src/VsArrayPlotter/bin/Release/VsArrayPlotter.vsix
